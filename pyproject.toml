[project]
name = "of3"
license = "GPL-3.0-or-later"

[tool.poetry]
name = "of3"
version = "0.2.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
click = "^8.1.7"
loguru = "^0.7.1"
pydantic = "^2.3.0"
requests = "^2.31.0"
api-client = "^1.3.1"
sqlmodel = { git = "https://github.com/mbsantiago/sqlmodel.git", branch = "main" }
xmltodict = "^0.13.0"

xsdata-pydantic = { extras = ["cli"], version = "^22.10" }
pydantic-settings = "^2.0.3"
yake = "^0.4.8"

[tool.poetry.group.drm.dependencies]
pywidevine = { version = "^1.6.0" }

[tool.poetry.group.tagging.dependencies]
pywin32 = { version = "^306", platform = "win32" }
rake-nltk = { version = "^1.0.6", platform = "win32" }

[tool.poetry.group.dev.dependencies]
black = "^23.9.0"
mypy = "^1.5.1"
mypy-extensions = "^1.0.0"
types-pywin32 = "^306.0.0.4"
ruff = "^0.0.292"
types-requests = "^2.31.0"
pytest = "^7.4.2"
pytest-cov = "^4.1.0"
xsdata-pydantic = { extras = ["cli"], version = "^22.10" }
freezegun = "^1.2.2"
requests-mock = "^1.11.0"
yappi = "^1.4.0"
snakeviz = "^2.2.0"
flameprof = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119

[tool.distutils.build_exe]
excludes = ["tkinter", "unittest"]
zip_include_packages = ["encodings"]

[tool.ruff]
# Same as Black.
line-length = 119

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--cov=src", "--cov-report=html"]
pythonpath = ". src"
